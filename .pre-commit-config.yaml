repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff-check
        types_or: [ python, pyi ]
        args: [--fix]
      
      - id: ruff-format
        types_or: [ python, pyi, markdown ]

  - repo: local
    hooks:
      - id: pytest
        name: Run pytest
        entry: python -m pytest -q
        language: system
        pass_filenames: false
        always_run: true
